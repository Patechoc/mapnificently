# Dependabot PRs merge themselves once the CI checks pass (the "main protected" ruleset requires
# them), but only for minor and patch updates of GitHub Actions and Python packages.
# Major updates and Docker image updates stay manual: CI builds the image only on main, and a
# base-image jump such as python:3.13 -> 3.15 counts as a "minor" update.
#
# pull_request_target, so the token can enable auto-merge on Dependabot PRs (on pull_request it
# is read-only for them) and this file always runs from main, never from the PR. It checks out
# no PR code.
name: Dependabot auto-merge

on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Patechoc/mapnificently'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
      # update-type is the largest change in the PR (a group with one major update is "major").
      - name: Enable auto-merge (rebase)
        if: >-
          contains(fromJSON('["uv", "github-actions", "github_actions"]'), steps.meta.outputs.package-ecosystem) &&
          contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
