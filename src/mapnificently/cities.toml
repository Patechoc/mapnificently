# Regions and cities known to Mapnificently.
#
# A region is downloaded and prepared once: its operators (feeds) and its area (bbox). A trip
# can use every operator of the region, so all its cities reach each other.
# A city is a named view of a region: where the map opens.
#
# Your own file, pointed to by MAPNIFICENTLY_CITIES_FILE, uses the same format; blocks with the
# same id override these. A city may also skip `region` and give the region fields itself
# (timezone, bbox, provider, feeds, attribution): it is then a region of its own.
#
#   provider  "entur": feeds are Entur codespaces, downloaded from
#                      https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_<code>-aggregated-gtfs.zip
#             "gtfs":  feeds are plain GTFS zip URLs (or local paths / file:// URLs)
#   bbox      [lon_min, lat_min, lon_max, lat_max]; stops outside are dropped
#   center    [lat, lon]

# ---------------------------------------------------------------------------- Oslofjord
# Oslo, Akershus, Østfold, Buskerud (Drammen) and Vestfold (Horten, Tønsberg), up to
# Gardermoen and Eidsvoll.
[regions.oslofjord]
name = "Oslofjord"
timezone = "Europe/Oslo"
bbox = [9.90, 58.90, 11.50, 60.40]
provider = "entur"
# Ruter, Vy trains, Østfold kollektivtrafikk, Flytoget, Brakar, Vestfold og Telemark
# (VKT), Go-Ahead and SJ trains.
feeds = ["rut", "vyg", "ost", "flt", "bra", "vkt", "goa", "sjn"]
attribution = "Timetables: Entur AS / Ruter / Vy / Østfold kollektivtrafikk / Flytoget / Brakar / VKT / Go-Ahead / SJ (NLOD)"

[cities.oslo]
name = "Oslo"
region = "oslofjord"
center = [59.9111, 10.7528]

[cities.moss]
name = "Moss"
region = "oslofjord"
center = [59.4340, 10.6590]

# ---------------------------------------------------------------------------- Bergen
[regions.bergen]
name = "Bergen"
timezone = "Europe/Oslo"
bbox = [5.00, 60.15, 5.65, 60.60]
provider = "entur"
feeds = ["sky", "vyg"]
attribution = "Timetables: Entur AS / Skyss / Vy (NLOD)"

[cities.bergen]
name = "Bergen"
region = "bergen"
center = [60.3913, 5.3221]

# ---------------------------------------------------------------------------- Trondheim
[regions.trondheim]
name = "Trondheim"
timezone = "Europe/Oslo"
bbox = [10.05, 63.25, 10.75, 63.55]
provider = "entur"
feeds = ["atb", "sjn"]
attribution = "Timetables: Entur AS / AtB / SJ Nord (NLOD)"

[cities.trondheim]
name = "Trondheim"
region = "trondheim"
center = [63.4305, 10.3951]

